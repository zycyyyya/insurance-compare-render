<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>分红型保险 · 利益演示对比</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f7fa;color:#333}
.header{background:linear-gradient(135deg,#1a2a6c,#2952a3);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;font-weight:600}
.container{max-width:1500px;margin:0 auto;padding:14px}
.panel{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px;overflow:hidden}
.panel-header{padding:10px 14px;border-bottom:1px solid #eee;font-weight:600;font-size:13px}
.panel-body{padding:14px}
.cat-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.cat-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #ddd;background:#fff;transition:all .2s;user-select:none}
.cat-tab.active{background:#2952a3;color:#fff;border-color:#2952a3}
.cat-tab:hover{border-color:#2952a3}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.prod-card{border:1px solid #e0e0e0;border-radius:8px;padding:12px;background:#fafafa;transition:border .2s}
.prod-card.selected{border-color:#2952a3;background:#f0f4ff}
.prod-card.hidden{display:none}
.prod-card label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:4px}
.prod-card input[type=checkbox]{width:16px;height:16px;accent-color:#2952a3}
.prod-card .cat-badge{font-size:10px;padding:2px 6px;border-radius:10px;color:#fff;font-weight:500;margin-left:4px}
.cat-badge.zeng额{background:#8e44ad}.cat-badge.快返{background:#e67e22}.cat-badge.养老{background:#27ae60}
.prod-card .slider-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#666;margin-top:6px}
.prod-card .slider-row input[type=range]{flex:1}
.prod-card .slider-row span{min-width:36px;text-align:right;font-weight:600}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:3px;min-width:100px}
.form-group label{font-size:11px;color:#666;font-weight:500}
.form-group input,.form-group select{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#2952a3}
.btn{padding:9px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;transition:all .2s}
.btn-primary{background:#2952a3;color:#fff}.btn-primary:hover{background:#1a3a7a}
.btn-outline{background:#fff;border:1px solid #2952a3;color:#2952a3}
.btn-green{background:#27ae60;color:#fff}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.card{background:#f8f9fb;padding:8px 10px;border-radius:6px;border:1px solid #eee}
.card .label{font-size:10px;color:#888}.card .value{font-size:15px;font-weight:700;color:#1a2a6c;margin:2px 0}
.card .sub{font-size:10px;color:#666}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart-box{position:relative;height:300px}
.chart-box.full{grid-column:1/-1;height:340px}
.scroll-table{max-height:500px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:#f8f9fb;padding:6px 4px;text-align:right;font-weight:600;color:#555;border-bottom:2px solid #ddd;position:sticky;top:0;z-index:1;white-space:nowrap}
thead th:first-child,tbody td:first-child{text-align:center}
tbody td{padding:5px 4px;text-align:right;border-bottom:1px solid #f0f0f0}
.num{font-variant-numeric:tabular-nums;font-family:"SF Mono","Consolas",monospace}
.loading{text-align:center;padding:30px;color:#999}
.error{color:#e74c3c;padding:10px;background:#fdeaea;border-radius:6px;margin:8px 0}
@media(max-width:768px){.chart-row{grid-template-columns:1fr}.prod-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div><h1>分红型保险 · 利益演示对比</h1><span style="font-size:10px;opacity:.7">增额终身寿 / 快返年金 / 养老年金 · 分红实现率可调</span></div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-green" onclick="exportExcel()">📥 Excel</button>
    <button class="btn btn-outline" style="color:#e74c3c;border-color:#e74c3c" onclick="exportPDF()">📄 PDF</button>
  </div>
</div>

<div class="container">
  <!-- 产品选择 -->
  <div class="panel">
    <div class="panel-header">📋 选择对比产品 <span style="font-weight:400;font-size:11px;color:#999">（可多选，拖动滑块调整分红实现率）</span></div>
    <div class="panel-body">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="prod-grid" id="prodGrid">加载中...</div>
    </div>
  </div>

  <!-- 公共参数 -->
  <div class="panel">
    <div class="panel-header">⚙ 公共参数</div>
    <div class="panel-body">
      <div class="form-row">
        <div class="form-group"><label>投保年龄</label><input type="number" id="age" value="41" min="0" max="70"></div>
        <div class="form-group"><label>性别</label><select id="sex"><option value="1">男</option><option value="2" selected>女</option></select></div>
        <div class="form-group"><label>交费年期</label><select id="pmtP"><option value="1">趸交</option><option value="3">3年</option><option value="5" selected>5年</option><option value="6">6年</option><option value="10">10年</option></select></div>
        <div class="form-group"><label>年交保费 (¥)</label><input type="number" id="premium" value="100000" min="5000" step="1000"></div>
        <div class="form-group" id="annageGroup" style="display:none"><label>领取年龄</label><select id="annage"><option value="55">55岁</option><option value="60" selected>60岁</option><option value="65">65岁</option><option value="70">70岁</option></select></div>
        <div class="form-group" id="planGroup" style="display:none"><label>方案选择</label><select id="planSelect"><option value="1" selected>计划一</option><option value="2">计划二</option><option value="3">计划三</option><option value="4">计划四</option></select></div>
        <div class="form-group" style="align-self:flex-end"><button class="btn btn-primary" onclick="calcAll()">计算对比</button></div>
      </div>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
let catalog=[], dataCache={}, charts=[], results=[], activeCat='all', irrAll=[];
let _db=null;
function openDB(){if(_db)return Promise.resolve(_db);return new Promise(r=>{const req=indexedDB.open('ins-cache',1);req.onupgradeneeded=e=>e.target.result.createObjectStore('data');req.onsuccess=e=>{_db=e.target.result;r(_db)};req.onerror=()=>r(null)})}
async function idbGet(k){const db=await openDB();if(!db)return null;return new Promise(r=>{const tx=db.transaction('data','readonly');const req=tx.objectStore('data').get(k);req.onsuccess=()=>r(req.result||null);req.onerror=()=>r(null)})}
async function idbPut(k,v){const db=await openDB();if(!db)return;const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k)}

function fmt(n,d=0){if(n==null)return'-';return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}

// ====== 分类 ======
const CAT_MAP={'增额终身寿':'zeng额','分红快返年金':'快返','分红养老年金':'养老'};

// ====== 加载产品目录 ======
fetch('data/catalog.json?'+Date.now()).then(r=>r.json()).then(data=>{
  catalog=data;
  renderCatTabs();
  renderProdGrid();
});

function renderCatTabs(){
  const cats=['all','增额终身寿','分红快返年金','分红养老年金'];
  let h='';
  cats.forEach(c=>{
    const label=c==='all'?'全部':c;
    h+=`<div class="cat-tab${c===activeCat?' active':''}" onclick="filterCat('${c}')">${label}</div>`;
  });
  document.getElementById('catTabs').innerHTML=h;
}

function filterCat(cat){
  activeCat=cat;
  renderCatTabs();
  catalog.forEach((p,i)=>{
    const card=document.getElementById('card'+i);
    const pcat=p.meta.category||'增额终身寿';
    card.classList.toggle('hidden',cat!=='all'&&pcat!==cat);
  });
  // Show/hide annage selector
  const hasPension=catalog.some(p=>{
    const pcat=p.meta.category||'';
    const cb=document.getElementById('card'+catalog.indexOf(p))?.querySelector('input[type=checkbox]');
    return (cat==='all'||pcat===cat)&&pcat.includes('养老')&&cb?.checked;
  });
  document.getElementById('annageGroup').style.display=hasPension?'flex':'none';
  // 方案选择仅青鸾显示
  const hasQingluan=catalog.some(p=>{
    const cb=document.getElementById('card'+catalog.indexOf(p))?.querySelector('input[type=checkbox]');
    return p.meta.calc_type==='qingluan_pension' && cb?.checked && (cat==='all'||(p.meta.category||'').includes('养老'));
  });
  document.getElementById('planGroup').style.display=hasQingluan?'flex':'none';
}

function renderProdGrid(){
  let h='';
  catalog.forEach((p,i)=>{
    const cat=p.meta.category||'增额终身寿';
    const badge=CAT_MAP[cat]||'';
    const badgeCls=CAT_MAP[cat]||'zeng额';
    h+=`<div class="prod-card selected" id="card${i}">
      <label><input type="checkbox" checked onchange="toggleProd(${i},this.checked)">${p.label}<span class="cat-badge ${badgeCls}">${badge}</span></label>
      <div class="slider-row">
        <span>分红实现率</span>
        <input type="range" id="rate${i}" min="0" max="200" value="100" oninput="document.getElementById('rateVal${i}').textContent=this.value+'%'">
        <span id="rateVal${i}">100%</span>
      </div>
    </div>`;
  });
  document.getElementById('prodGrid').innerHTML=h;
}

function toggleProd(i,on){
  document.getElementById('card'+i).classList.toggle('selected',on);
}

// ====== 数据加载（gzip优先，支持按需拆分） ======
async function loadData(p, annage, plan){
  const cacheKey = p.name + (annage ? `_${annage}_${plan||1}` : '');
  if(dataCache[cacheKey]) return dataCache[cacheKey];
  try{const c=await idbGet(cacheKey);if(c){dataCache[cacheKey]=c;return c;}}catch(e){}
  // 确定加载路径
  let basePath = 'data/' + p.name;
  if(p.meta.calc_type === 'qingluan_pension' && annage){
    basePath = `data/qingluan/${annage}-${plan||1}`;
  }
  // 优先加载.gz文件
  let data;
  try{
    const resp=await fetch(basePath+'.json.gz?'+Date.now());
    if(resp.ok){
      const buf=await resp.arrayBuffer();
      const decompressed=pako.inflate(new Uint8Array(buf),{to:'string'});
      data=JSON.parse(decompressed);
    }
  }catch(e){}
  if(!data){
    try{data=await fetch(basePath+'.json?'+Date.now()).then(r=>r.json());}catch(e){}
  }
  if(!data) return null;
  dataCache[cacheKey]=data;
  try{idbPut(cacheKey,data);}catch(e){}
  return data;
}

// ====== 计算 ======
async function calcAll(){
  const a=+age.value, s=+sex.value, pt=+pmtP.value, pr=+premium.value, ann=+annage.value, plan=+planSelect.value;
  results=[]; charts.forEach(c=>c.destroy()); charts=[];
  document.getElementById('result').innerHTML='<div class="loading">计算中...</div>';

  // 收集需要计算的产品，并行加载数据
  const todo=[];
  for(let i=0;i<catalog.length;i++){
    const card=document.getElementById('card'+i);
    if(!card||card.classList.contains('hidden'))continue;
    const cb=card.querySelector('input[type=checkbox]');
    if(!cb||!cb.checked) continue;
    todo.push({idx:i,p:catalog[i],rate:parseInt(document.getElementById('rate'+i).value)/100});
  }
  // 并行加载所有数据（青鸾版按需加载）
  await Promise.all(todo.map(t=>{
    if(t.p.meta.calc_type==='qingluan_pension') return loadData(t.p, ann, plan);
    return loadData(t.p);
  }));

  // 逐个计算（计算本身很快，瓶颈在数据加载和IRR）
  for(const t of todo){
    const cacheKey = t.p.meta.calc_type==='qingluan_pension' ? `${t.p.name}_${ann}_${plan}` : t.p.name;
    const d=dataCache[cacheKey];
    let r;
    const ct=t.p.meta.calc_type;
      if(ct==='taiyingjia') r=calcTYJ(a,s,pt,pr,d);
      else if(ct==='zhongyi') r=calcZY(a,s,pt,pr,d,t.p);
      else if(ct==='zhongyou') r=calcZHY(a,s,pt,pr,d);
      else if(ct==='zhongying') r=calcZHYG(a,s,pt,pr,d);
      // === 新增年金产品 ===
      else if(ct==='ljgt_annuity') r=calcLJGT(a,s,pt,pr,d,t.p);
      else if(ct==='changcheng_annuity') r=calcCC(a,s,pt,pr,d,t.p);
      else if(ct==='zhongyou_pension') r=calcZHYP(a,s,pt,pr,d,ann);
      else if(ct==='qingluan_pension') r=calcQL(a,s,pt,pr,d,ann,plan,t.p);
      else if(ct==='zhongyi_annuity') r=calcZYA(a,s,pt,pr,d,t.p);
      else continue;
      if(!r||!r.rows) continue;
      r.label=t.p.label; r.dividend_rate=t.rate; r.category=t.p.meta.category||'增额终身寿';
      results.push(r);
  }
  if(results.length===0){document.getElementById('result').innerHTML='<div class="error">无产品被选中或计算失败</div>';return}
  render();
}

// ====== 增额终身寿（原有） ======

// --- 泰赢家 ---
function calcTYJ(age,sex,pmtP,prem,d){
  const SU=0.01,DR=0.70,adRL=0.0175,adRM=0.039;
  // v2: factors[key]=[cv,db,rv,vnp,rv_pvfb,cv_pvfb,bonus_db]
  const L=k=>{const v=d.factors[sex+'-'+pmtP+'-'+age+'-'+k];return v||[0,0,0,0,0,0,0]};
  const saR=d.sa_ratio[sex+'-'+pmtP+'-'+age]||0, saB=Math.round(prem*saR/100*10)/10;
  const maxYr=105-age; let rows=[],cumPre=0,cumBns=0;
  for(let t=1;t<=maxYr;t++){
    const p=t<=pmtP?prem:0; cumPre+=p;
    const f=L(t);
    const cvF=f[0],dbF=f[1],rvF=f[2];
    const vnpF=t<=pmtP?f[3]:0,rvP=f[4],cvP=f[5];
    const bnsDb=f[6],prvF=L(Math.max(0,t-1)),prvRV=prvF[2],prvRVP=prvF[4];
    const gCV=Math.round(cvF*saB/SU*10)/10;
    const gDB=Math.max(Math.round(dbF*saB/SU*10)/10,gCV);
    const vnpT=pmtP===1?0:vnpF;
    const yrDiv=Math.round(((prvRV+vnpT)*saB/SU+cumBns*prvRVP/SU)*(adRM-adRL)*DR*10)/10;
    const bInc=rvP>0?Math.round(yrDiv/rvP*SU*10)/10:0; cumBns+=bInc;
    const bCV=Math.round(cumBns*cvP/SU*10)/10;
    rows.push({year:t,age:age+t,premium:p,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,raw_bonus_cv:bCV,raw_bonus_db:Math.max(Math.round(bnsDb*cumBns/SU*10)/10,bCV),survival_benefit:0});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:pmtP,entry_age:age};
}

// --- 中意（增额） ---
function calcZY(age,sex,pmtP,prem,d,p){
  const SG=0.0175;
  let code=null,gp=null;
  if(d.code_map){const entry=d.code_map[pmtP+'-'+sex+'-'+age];if(entry){code=entry[0];gp=entry[1];}}
  if(!code){for(const k of Object.keys(d.factors)){if(k.endsWith('-1')){code=k.split('-')[0];gp=d.factors[k][1];break}}}
  if(!code)return null;
  const gpRounded=Math.round(gp*10)/10;
  const saPerShare=Math.ceil(1000/gpRounded*1000);
  const shares=Math.floor(prem/1000*10000)/10000;
  const saB=Math.floor(saPerShare*shares);
  const maxYr=105-age; let rows=[],cumPre=0,cumBns=0;
  const prods=p.meta.products; const pn=prods&&prods[0]?prods[0].name:'';
  // v2: factors[key]=[premium,cv,rpu]
  for(let t=1;t<=maxYr;t++){
    const pr=t<=pmtP?prem:0; cumPre+=pr;
    const f=d.factors[code+'-'+t]||[0,0,0];
    const cvPU=f[1], rpu=f[2];
    const bnsR=d.bonus[pn+'|'+pmtP+'-'+sex+'-'+age+'-'+t]; const bnsSA=bnsR?bnsR[0]:0;
    const saCur=Math.round(saB*Math.pow(1+SG,t-1));
    const gCV=Math.round(saB*cvPU/10000);
    const totPA=prem*pmtP,curAge=age+t;
    let gDB;if(curAge<=18)gDB=Math.max(Math.round(cumPre),gCV);else if(t<=pmtP)gDB=Math.max(Math.round(cumPre*1.6),gCV);else gDB=Math.max(Math.round(totPA*1.6),saCur,gCV);
    const aBSA=Math.round(saB*bnsSA/100000); cumBns+=aBSA;
    const bCV=Math.round(cumBns*rpu/10000);
    rows.push({year:t,age:curAge,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,sa_current:saCur,
      guaranteed_cv:gCV,guaranteed_db:gDB,raw_bonus_cv:bCV,raw_bonus_db:Math.max(bCV,0),survival_benefit:0});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:pmtP,entry_age:age};
}

// --- 中邮（增额） ---
function calcZHY(age,sex,NP,prem,d){
  const SG=0.02,DR=0.01575,share=prem/1000;
  const L=k=>{const v=d.factors[sex+'-'+NP+'-'+age+'-'+k];return v||[0,0,0,0,0,0,0,0,0]};
  const f1=L(1); if(!f1[0])return null; const saPU=f1[0],saB=Math.round(saPU*share);
  const maxYr=105-age; let rows=[],cumPre=0,cumJQ=0,prevER=0,prevJQER=0;
  for(let t=1;t<=maxYr;t++){
    const pr=t<=NP?prem:0; cumPre+=pr; const f=L(t); if(!f||f[0]===0&&t>1)break;
    const gCV=Math.round(f[1]*share),gDB=Math.round(f[4]*share);
    const diva=DR*(f[2]+prevER)*share; prevER=f[3]; const divb=DR*prevJQER;
    const totDiv=diva+divb; cumJQ+=f[5]>0?totDiv/f[5]:0; prevJQER=cumJQ/1000*f[7];
    const bCV=Math.round(cumJQ/1000*f[6]),bDB=Math.round(cumJQ/1000*f[8]);
    rows.push({year:t,age:age+t,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,raw_bonus_cv:bCV,raw_bonus_db:bDB,survival_benefit:0});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:NP,entry_age:age};
}

// --- 中英（增额） ---
function calcZHYG(age,sex,NP,prem,d){
  const SG=0.0175; const rPU=d.rate[NP+'-'+sex+'-'+age]||0; if(!rPU)return null;
  const share=prem/1000,saB=Math.round(rPU*share);
  // v2: factors[key]=[cv_base,bonus_factor,jq_prem,jq_bonus,jq_cv]
  const L=k=>{const v=d.factors[NP+'-'+sex+'-'+age+'-'+k];return v||[0,0,0,0,0]};
  const maxYr=105-age; let rows=[],cumPre=0,cumJQ=0;
  for(let t=1;t<=maxYr;t++){
    const pr=t<=NP?prem:0; cumPre+=pr;
    const f=L(t); const cvPU=f[0]; if(!cvPU&&t>1)break;
    const bnsPU=f[1],jqPPU=f[2],jqBPU=f[3],jqCPU=f[4];
    const gCV=Math.round(cvPU*share),gDB=Math.max(Math.round(saB*Math.pow(1+SG,t-1)),gCV);
    const divB=bnsPU*saB/1000,divJ=jqBPU*cumJQ/1000; const totDiv=divB+divJ;
    const annJQ=jqPPU>0?Math.round(totDiv/jqPPU*1000):0; cumJQ+=annJQ;
    const bCV=Math.round(cumJQ/1000*jqCPU);
    rows.push({year:t,age:age+t,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,raw_bonus_cv:bCV,raw_bonus_db:Math.max(bCV,0),survival_benefit:0});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:NP,entry_age:age};
}

// ====== 年金产品（新增） ======

// --- 陆家嘴国泰年金（泰给利/泰享年年） ---
function calcLJGT(age,sex,pmtP,prem,d,p){
  const SU=0.01,DR=p.meta.dividend_ratio||0.7,adRL=p.meta.ad_r_l||0.0175,adRM=p.meta.ad_r_m||0.039;
  const sbStart=p.meta.sb_start||0, sbFactor=p.meta.sb_annual_factor||1;
  const L=k=>d.factors[sex+'-'+pmtP+'-'+age+'-'+k]||[0,0,0,0,0,0,0];
  const saR=d.sa_ratio[sex+'-'+pmtP+'-'+age]||0, saB=Math.round(prem*saR/100*10)/10;
  if(!saB)return null;
  const maxYr=105-age; let rows=[],cumPre=0,cumBns=0;
  // 检查是否有PVFB因子(len>=7 → 泰享年年养老年金模式)
  const f1=L(1); const hasPvfb=f1.length>=7;

  for(let t=1;t<=maxYr;t++){
    const pr=t<=pmtP?prem:0; cumPre+=pr;
    const f=L(t); const cvF=f[0],dbF=f[1],sbF=f[2],mbF=f[3],rvNP=f[4];
    const cvP=f[5]||0, rvP=f[6]||0, rvRaw=f[7]||0; // CV_PVFB, RV_PVFB, RV (仅养老年金)
    const cvBase=Math.max(rvNP,cvF);
    const gCV=Math.round(cvBase*saB/SU*10)/10;
    const gDB=Math.max(Math.round(dbF*saB/SU*10)/10,cumPre,gCV);
    const sbRaw=sbF*saB/SU;
    const sb=sbF>0?Math.round(sbRaw/sbFactor*10)/10:0;
    const mb=mbF>0?Math.round(mbF*saB/SU*10)/10:0;

    // 分红：有RV用完整公式(养老年金)，无RV用简化公式(快返)
    let yrDiv=0;
    if(hasPvfb && t>1){
      // 养老年金：前一年RV作红利基础，与前一年RV_PVFB转换
      const pvF=L(t-1);
      const prvRV=pvF[7]||0, prvRVP=pvF[6]||0;
      yrDiv=prvRV>0?Math.round(prvRV*saB/SU*(adRM-adRL)*DR*10)/10:0;
      const bInc=prvRVP>0?yrDiv*SU/prvRVP:0;
      cumBns+=bInc;
    }else{
      yrDiv=cvBase>0?Math.round(cvBase*saB/SU*(adRM-adRL)*DR*10)/10:0;
      cumBns+=yrDiv;
    }

    // 红利现价
    let bCV=0, bDB=0, bSB=0;
    if(hasPvfb){
      // 累积红利保额 × CV_PVFB / SU
      bCV=cvP>0?Math.round(cumBns*cvP/SU*10)/10:0;
      bDB=dbF>0?Math.round(cumBns*dbF/SU*10)/10:0;
      bSB=sbF>0?Math.round(cumBns*sbF/SU/sbFactor*10)/10:0;
    }else{
      bCV=Math.round(cumBns*10)/10;
      bDB=Math.max(bCV,0);
    }

    rows.push({year:t,age:age+t,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,survival_benefit:sb+bSB,maturity_benefit:mb,
      annual_dividend:yrDiv,raw_bonus_cv:bCV,raw_bonus_db:bDB});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:pmtP,entry_age:age};
}

// --- 长城八达岭绝影版（per-1000-premium 数据，快返年金有生存给付+分红） ---
function calcCC(age,sex,pmtP,prem,d,p){
  const share=prem/1000, bpStart=p.meta.bp_start||5;
  const L=k=>d.factors[sex+'-'+pmtP+'-'+age+'-'+k]||[0,0];
  // saR 存储原始SA值(per 1000 prem), saB = 年金年领金额
  const saR=d.sa_ratio[sex+'-'+pmtP+'-'+age]||0, saB=Math.round(saR*share);
  if(!saB)return null;
  const maxYr=105-age; let rows=[],cumPre=0, cumBns=0;
  for(let t=1;t<=maxYr;t++){
    const pr=t<=pmtP?prem:0; cumPre+=pr;
    const f=L(t); const cvF=f[0],bCVF=f[1];
    const gCV=Math.round(cvF*share);
    const gDB=Math.max(gCV,cumPre);
    // 红利: 每年红利金额(年度)，累积后按JQ估值
    const annualDiv=bCVF>0?Math.round(bCVF*share):0;
    cumBns+=annualDiv;
    const bCV=Math.round(cumBns); // 累积红利(简化)
    // 快返年金: 达到BPstart年开始每年领取年金=saB + 年金分红
    const annualPayout=t>=bpStart?saB:0;
    const bonusPayout=t>=bpStart?annualDiv:0;
    rows.push({year:t,age:age+t,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,survival_benefit:annualPayout+bonusPayout,maturity_benefit:0,
      raw_bonus_cv:bCV,raw_bonus_db:Math.max(bCV,0),annual_dividend:annualDiv});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:pmtP,entry_age:age};
}

// --- 中邮乐享鑫年（养老年金，per-1000-premium数据） ---
// factors: [cv, sb, mb, db, bonus_begin, bonus_end, jq_factor, jq_sa, jq_cv, jq_bb, jq_be, jq_sb, jq_mb, jq_db]
function calcZHYP(age,sex,pmtP,prem,d,annage){
  const share=prem/1000, DR=(p&&p.meta&&p.meta.dividend_ratio)||0.7, divRate=(p&&p.meta&&p.meta.dividend_rate)||0.035, ann=annage||60;
  const L=k=>d.factors[sex+'-'+pmtP+'-'+age+'-'+ann+'-'+k];
  const saR=d.sa_ratio[sex+'-'+pmtP+'-'+age+'-'+ann]||0, saB=Math.round(saR*share);
  if(!saB)return null;
  const maxYr=105-age; let rows=[],cumPre=0,cumJQ=0;
  for(let t=1;t<=maxYr;t++){
    const pr=t<=pmtP?prem:0; cumPre+=pr;
    const f=L(t); if(!f&&t>1)break; if(!f)continue;
    const cvF=f[0],sbF=f[1],mbF=f[2],dbF=f[3],bbF=f[4],beF=f[5];
    const jqF=f[6],jqSaF=f[7],jqCvF=f[8],jqBBF=f[9],jqBEF=f[10],jqSbF=f[11],jqMbF=f[12],jqDbF=f[13];
    const gCV=Math.round(cvF*share);
    const gDB=Math.max(Math.round(dbF*share),cumPre,gCV);
    const sb=sbF>0?Math.round(sbF*share):0;
    const mb=mbF>0?Math.round(mbF*share):0;
    // 红利: bonusBase*share * 演示利率 * 实现率 = 分红金额(元)
    const bonusBase=bbF;
    const yrDiv=bonusBase>0?Math.round(bonusBase*share*divRate*DR):0;
    // 交清增额: yrDiv / jqF → JQ保额(SA); bCV = JQ保额 × (cv_per_SA)
    const annJQ=jqF>0?yrDiv/jqF:0; cumJQ+=annJQ;
    const bCV=jqCvF>0?Math.round(cumJQ*jqCvF/jqSaF):0;
    const bDB=jqDbF>0?Math.max(Math.round(cumJQ*jqDbF/jqSaF),bCV):bCV;

    // JQ部分的SB/MB (累积红利产生的给付)
    const jqSB=jqSbF>0?Math.round(cumJQ*jqSbF/jqSaF):0;
    const totalSB=sb+jqSB;
    rows.push({year:t,age:age+t,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,survival_benefit:totalSB,maturity_benefit:mb,
      raw_bonus_cv:bCV,raw_bonus_db:bDB});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:pmtP,entry_age:age};
}

// --- 青鸾版（养老年金，交清增额逻辑，按需拆分） ---
// 拆分后key格式: sex-pmtP-age-year (不含annage-plan)
function calcQL(age,sex,pmtP,prem,d,annage,plan,p){
  const share=prem/1000, ann=annage||60, pl=plan||1;
  const L=k=>d.factors[sex+'-'+pmtP+'-'+age+'-'+k];
  const saR=d.sa_ratio[sex+'-'+pmtP+'-'+age]||0, saB=Math.round(saR*prem/100*10)/10;
  if(!saB)return null;
  const divRate=(p&&p.meta&&p.meta.dividend_rate)||0.039;
  const guaranteeRate=(p&&p.meta&&p.meta.guarantee_rate)||0.0175;
  const DR=(p&&p.meta&&p.meta.dividend_ratio)||0.7;
  const maxYr=Math.min(80, 105-age); let rows=[],cumPre=0;
  let cumAO=0; // 累积交清增额单位 (AO = AG + AN)
  for(let t=1;t<=maxYr;t++){
    const pr=t<=pmtP?prem:0; cumPre+=pr;
    const f=L(t); if(!f&&t>1)break; if(!f)continue;
    const csvF=f[0],rsvT=f[1],rbCvT=f[2],rbrsvT=f[3],rbnpT=f[4];
    const gCV=Math.round(csvF*share);
    const gDB=Math.max(Math.round(rsvT*share),cumPre,gCV);
    const annualPayout=age+t>=ann?saB:0;
    // 交清增额逻辑: AD = AO × rb_cv_t × share
    // AC = (RSV_t + RBRSV_t × AO_prev) × (演示利率 - 定价利率) × 70%
    // AE = AC / RBNP_t (当年购买单位)
    // AG = AE + AO_prev (分红后累积)
    // AO = AG + AN (AN=0简化，因为前5年H=0)
    let bCV=0, bDB=0, bSB=0;
    if(gCV>0){
      const ac=(rsvT+rbrsvT*cumAO)*(divRate-guaranteeRate)*DR;
      const ae=rbnpT>0?ac/rbnpT:0;
      const ag=ae+cumAO;
      cumAO=ag; // AN=0 simplified
      bCV=Math.round(cumAO*rbCvT*share);
      bDB=Math.round(cumAO*rbrsvT*share);
      bSB=Math.round(cumAO*rbnpT*share);
    }
    rows.push({year:t,age:age+t,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,survival_benefit:annualPayout+bSB,maturity_benefit:0,
      raw_bonus_cv:bCV,raw_bonus_db:Math.max(bDB,0)});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:pmtP,entry_age:age};
}

// --- 中意意值有（快返年金） ---
function calcZYA(age,sex,pmtP,prem,d,p){
  // code映射: PmtP→前缀, 保至105+计划一
  const prefixMap={1:'BK77',3:'BK78',5:'BK79',6:'BK81',10:'BK80'};
  const prefix=prefixMap[pmtP]||'BK78';
  const sexCode=sex===1?'M':'F';
  const code=prefix+'00'+'C'+sexCode; // age编码为2位数字

  // 查找最近匹配的code (age可能不精确匹配,取≥的最小age)
  let bestCode=null,gp=null;
  for(const c of Object.keys(d.premium_cv||{}).filter(k=>k.startsWith(prefix))){
    const codeParts=c.split('-')[0];
    if(!codeParts.endsWith('C'+sexCode))continue;
    // 提取age: prefix + 2位age + C + sex
    const ageStr=codeParts.substring(prefix.length,prefix.length+2);
    const codeAge=parseInt(ageStr);
    if(codeAge===age){
      const entry=d.premium_cv[codeParts+'-0'];
      if(entry){bestCode=codeParts;gp=entry[1];break;}
    }
  }
  // 回退: 取该prefix的第一个匹配code
  if(!bestCode){
    for(const c of Object.keys(d.premium_cv||{})){
      const codeParts=c.split('-')[0];
      if(codeParts.startsWith(prefix)&&codeParts.endsWith('C'+sexCode)){
        const entry=d.premium_cv[codeParts+'-0'];
        if(entry){bestCode=codeParts;gp=entry[1];break;}
      }
    }
  }
  if(!bestCode||!gp)return null;

  // basicSA = CEIL(10000/gp*1000) × (prem/payFreq/10000)
  const gpR=Math.round(gp*10)/10;
  const saFactor=Math.ceil(10000/gpR*1000);
  const payFreq=1; // 年交
  const premFactor=Math.round(prem/payFreq/10000*10000)/10000;
  const saB=Math.floor(saFactor*premFactor);
  if(!saB)return null;

  // 查找匹配的 rpu code (AZ前缀, 同数字部分)
  const numPart=bestCode.substring(2); // e.g. "7800CM"
  let rpuCode=null;
  for(const c of Object.keys(d.rpu||{})){
    const rp=c.split('-')[0];
    if(rp.substring(2)===numPart){rpuCode=rp;break;}
  }
  if(!rpuCode)rpuCode=bestCode.replace('BK','AZ');

  const maxYr=105-age; let rows=[],cumPre=0,cumBns=0;
  for(let t=1;t<=maxYr;t++){
    const pr=t<=pmtP?prem:0; cumPre+=pr;
    const cvR=d.premium_cv[bestCode+'-'+t];
    const cvPU=cvR?cvR[0]:0;
    const gCV=Math.round(saB*cvPU/10000);
    // 保证生存金: 交费期满后每年领取基本保额
    const guaranteedPayout=t>pmtP?saB:0;
    // 红利: bonus_val是每1000保额的红利金额(现金红利)
    let bnsSA=0;
    for(const plan of ['计划一','计划二','计划三']){
      const key=plan+'|'+pmtP+'-'+sex+'-'+age+'-'+t;
      if(d.bonus&&d.bonus[key]){bnsSA=d.bonus[key];break}
    }
    const bonusPayout=Math.round(saB*bnsSA/1000);
    // bCV via RPU
    const rpu=d.rpu[rpuCode+'-'+t]||0;
    const aBSA=Math.round(saB*bnsSA/100000);cumBns+=aBSA;
    const bCV=Math.round(cumBns*rpu/10000);
    const gDB=Math.max(Math.round(cumPre),gCV);

    rows.push({year:t,age:age+t,premium:pr,cum_premium:Math.round(cumPre),sa_basic:saB,
      guaranteed_cv:gCV,guaranteed_db:gDB,survival_benefit:guaranteedPayout+bonusPayout,maturity_benefit:0,
      raw_bonus_cv:bCV,raw_bonus_db:Math.max(bCV,0)});
  }
  return {sa_basic:saB,rows,annual_premium:prem,pmt_p:pmtP,entry_age:age};
}

// ====== 单利（含年金/红利） ======
function calcSimpleRate(rows,premium,pmtP){
  const d=[];
  let cumSB=0; // 累计已领取年金+红利
  for(const row of rows){
    const yrs=row.year;
    const sb=(row.survival_benefit||0); // 当年领取=年金(含红利分红)
    cumSB+=sb;
    const val=row.total_cv+cumSB; // 总回报=当前CV+累计已领取
    if(val<=0||yrs<1){d.push({year:row.year,simple:null});continue}
    let weightedInvest=0, totalInvest=0;
    for(let y=1;y<=yrs;y++){
      if(y<=pmtP){weightedInvest+=premium*(yrs-y+1);totalInvest+=premium}
    }
    const gain=val-totalInvest;
    const simple=weightedInvest>0?gain/weightedInvest*100:null;
    d.push({year:row.year,simple:simple});
  }
  return d;
}

// ====== 渲染 ======
function render(){
  let html='';
  // 对比图表
  html+='<div class="chart-row"><div class="chart-box full"><canvas id="cCmpCV"></canvas></div></div>';

  // Apply dividend rate and compute total_cv
  for(const r of results){
    for(const row of r.rows){
      row.bonus_cv_adj=Math.round(row.raw_bonus_cv*r.dividend_rate);
      row.bonus_db_adj=Math.round((row.raw_bonus_db||0)*r.dividend_rate);
      row.total_cv=row.guaranteed_cv+row.bonus_cv_adj;
      row.total_db=row.guaranteed_db+row.bonus_db_adj;
    }
  }

  const hasSB=results.some(r=>r.rows.some(row=>(row.survival_benefit||0)>0));
  const maxYr=Math.min(...results.map(r=>r.rows.length));
  const showSet=new Set(); for(let y=1;y<=maxYr;y++){if(y<=10||y%5===0||y===maxYr)showSet.add(y)}

  // Summary cards
  html+='<div class="panel"><div class="panel-header">📊 关键指标对比</div><div class="panel-body"><div class="summary-cards">';
  for(const r of results){
    let be='—',db2='—',cumSB2=0;
    for(const row of r.rows){
      cumSB2+=(row.survival_benefit||0);
      if(be==='—'&&row.total_cv+cumSB2>=row.cum_premium)be=row.year;
      if(db2==='—'&&row.total_cv+cumSB2>=row.cum_premium*2)db2=row.year;
    }
    const row10=r.rows[9]; const row20=r.rows[19];
    // 快速IRR计算（只算第10年和第20年）
    function quickIRR(yrs){
      const rows=r.rows.slice(0,yrs); const prem=r.annual_premium; const pp=r.pmt_p;
      const cfs=[];
      for(let y=0;y<rows.length;y++){
        const row=rows[y]; let cf=0;
        if(y<pp) cf-=prem;
        cf+=(row.survival_benefit||0);
        if(y===rows.length-1) cf+=(row.total_cv||row.guaranteed_cv);
        cfs.push(cf);
      }
      let lo=-0.999,hi=2.0,flo=npvAt(lo,cfs),fhi=npvAt(hi,cfs);
      if(flo*fhi>0) return null;
      for(let it=0;it<60;it++){const mid=(lo+hi)/2,fm=npvAt(mid,cfs);if(Math.abs(fm)<1e-6){lo=hi=mid;break}if(flo*fm<0)hi=mid;else lo=mid;if(hi-lo<1e-10)break}
      let rate=(lo+hi)/2;
      for(let it=0;it<30;it++){let npv=cfs[0],dnpv=0;for(let j=1;j<cfs.length;j++){const dv=Math.pow(1+rate,j);npv+=cfs[j]/dv;dnpv+=-j*cfs[j]/Math.pow(1+rate,j+1)}if(Math.abs(dnpv)<1e-15)break;const nr=rate-npv/dnpv;if(Math.abs(nr-rate)<1e-10){rate=nr;break}rate=nr}
      return isFinite(rate*100)?rate*100:null;
    }
    const irr10v=quickIRR(10); const irr20v=quickIRR(20);
    // 年金产品额外计算：总领取
    let cumSB=0; for(const row of r.rows)cumSB+=(row.survival_benefit||0);
    html+=`<div class="card"><div class="label">${r.label}<br>分红${Math.round(r.dividend_rate*100)}%</div>
      <div class="value">${fmt(r.sa_basic,1)}</div>
      <div class="sub">保额 | 回本${be}年 | 翻倍${db2}年</div>
      <div class="sub">10年CV ${fmt(row10?row10.total_cv:0)} | 20年CV ${fmt(row20?row20.total_cv:0)}</div>
      <div class="sub">10年IRR ${irr10v!=null?irr10v.toFixed(2)+'%':'-'} | 20年IRR ${irr20v!=null?irr20v.toFixed(2)+'%':'-'}</div>
      ${cumSB>0?`<div class="sub" style="color:#27ae60">累计领取 ¥${fmt(cumSB)}</div>`:''}
    </div>`;
  }
  html+='</div></div></div>';

  // 详细对比表
  const colsPerProduct=hasSB?7:5;
  html+='<div class="panel"><div class="panel-header">📋 利益演示对比</div><div class="scroll-table"><table><thead><tr><th>年度</th><th>年龄</th>';
  for(const r of results){
    html+=`<th colspan="${colsPerProduct}">${r.label} (分红${Math.round(r.dividend_rate*100)}%)</th>`;
  }
  html+='</tr><tr style="font-size:10px"><th></th><th></th>';
  for(let i=0;i<results.length;i++){
    html+='<th>累计<br>保费</th><th>保证<br>CV</th><th>总CV<br>(含红利)</th>';
    if(hasSB)html+='<th>生存金/<br>年金</th>';
    html+='<th>单利</th><th>IRR</th>';
  }
  html+='</tr></thead><tbody>';

  const simpleRates=results.map(r=>calcSimpleRate(r.rows,r.annual_premium,r.pmt_p));
  // IRR优化：只计算展示年度，不计算全部105年
  irrAll=results.map(r=>{
    const full=new Array(r.rows.length).fill(null);
    for(const yr of showSet){
      if(yr<2)continue;
      const rows=r.rows.slice(0,yr);
      const cfs=[];
      for(let y=0;y<rows.length;y++){
        const row=rows[y];
        let cf=0;
        if(y<r.pmt_p) cf-=r.annual_premium;
        cf+=(row.survival_benefit||0);
        if(y===rows.length-1) cf+=(row.total_cv||row.guaranteed_cv);
        cfs.push(cf);
      }
      let lo=-0.999,hi=2.0,flo=npvAt(lo,cfs),fhi=npvAt(hi,cfs);
      let irrVal=null;
      if(flo*fhi<=0){
        for(let it=0;it<60;it++){const mid=(lo+hi)/2,fm=npvAt(mid,cfs);if(Math.abs(fm)<1e-6){lo=hi=mid;break}if(flo*fm<0)hi=mid;else lo=mid;if(hi-lo<1e-10)break}
        let rate=(lo+hi)/2;
        for(let it=0;it<30;it++){let npv=cfs[0],dnpv=0;for(let j=1;j<cfs.length;j++){const dv=Math.pow(1+rate,j);npv+=cfs[j]/dv;dnpv+=-j*cfs[j]/Math.pow(1+rate,j+1)}if(Math.abs(dnpv)<1e-15)break;const nr=rate-npv/dnpv;if(Math.abs(nr-rate)<1e-10){rate=nr;break}rate=nr}
        const irr=rate*100;irrVal=isFinite(irr)?irr:null;
      }
      full[yr-1]={year:yr,irr:irrVal};
    }
    return full;
  });

  for(const yr of showSet){
    html+=`<tr${yr%10===0?' style="background:#fff9e6"':''}><td>${yr}</td><td>${results[0].entry_age+yr}</td>`;
    for(let i=0;i<results.length;i++){
      const row=results[i].rows[yr-1]; const sr=simpleRates[i][yr-1]; const ir=irrAll[i][yr-1];
      const irrTxt=(ir&&ir.irr!=null&&ir.irr>=0)?ir.irr.toFixed(2)+'%':'-';
      html+=`<td class="num">${fmt(row.cum_premium)}</td>
        <td class="num" style="color:#2952a3">${fmt(row.guaranteed_cv)}</td>
        <td class="num" style="font-weight:700;color:#1a2a6c">${fmt(row.total_cv)}</td>`;
      if(hasSB)html+=`<td class="num" style="color:#27ae60">${fmt(row.survival_benefit||0)}</td>`;
      html+=`<td class="num" style="color:#e67e22">${sr&&sr.simple!=null?sr.simple.toFixed(2)+'%':'-'}</td>
        <td class="num" style="color:${ir&&ir.irr&&ir.irr>3?'#27ae60':'#666'}">${irrTxt}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table></div></div>';

  document.getElementById('result').innerHTML=html;
  setTimeout(()=>drawChart(),100);
}

function drawChart(){
  const maxYr=Math.min(...results.map(r=>r.rows.length));
  const filter=[]; for(let y=1;y<=maxYr;y++){if(y<=30||y%5===0)filter.push(y); if(y>60)break}
  const colors=['#2952a3','#e74c3c','#27ae60','#e67e22','#8e44ad','#16a085','#c0392b','#2c3e50','#d35400','#16a085','#8e44ad'];
  const datasets=results.map((r,i)=>{
    const lbl=filter.map(y=>{const row=r.rows[y-1];return row?row.total_cv:null});
    return {
      label:`${r.label} (分红${Math.round(r.dividend_rate*100)}%)`,
      data:lbl,borderColor:colors[i%colors.length],
      backgroundColor:colors[i%colors.length]+'20',fill:false,tension:.3
    };
  });
  charts.push(new Chart(document.getElementById('cCmpCV'),{type:'line',data:{labels:filter,datasets},
    options:{responsive:true,maintainAspectRatio:false,
    plugins:{title:{display:true,text:'总现金价值对比（含红利×分红实现率）',font:{size:13}}},
    scales:{y:{ticks:{callback:v=>fmt(v/10000)+'万'}}}}}));
}

function npvAt(rate,cfs){let s=cfs[0];for(let j=1;j<cfs.length;j++)s+=cfs[j]/Math.pow(1+rate,j);return s}
function calcIRR(rows,premium,pmtP){
  const d=[];
  for(let i=0;i<rows.length;i++){
    const yrs=i+1; if(yrs<2){d.push({year:rows[i].year,irr:null});continue}
    // 现金流：每年 = -保费 + 年金 + 红利；最后一年额外+退保CV
    const cfs=[];
    for(let y=0;y<yrs;y++){
      const row=rows[y];
      let cf=0;
      if(y<pmtP) cf-=premium; // 交保费
      cf+=(row.survival_benefit||0); // 领年金(含红利)
      if(y===yrs-1) cf+=(row.total_cv||row.guaranteed_cv); // 最后一年退保
      cfs.push(cf);
    }
    let lo=-0.999,hi=2.0,flo=npvAt(lo,cfs),fhi=npvAt(hi,cfs);
    if(flo*fhi>0){d.push({year:rows[i].year,irr:null});continue}
    for(let it=0;it<60;it++){const mid=(lo+hi)/2,fm=npvAt(mid,cfs);if(Math.abs(fm)<1e-6){lo=hi=mid;break}if(flo*fm<0)hi=mid;else lo=mid;if(hi-lo<1e-10)break}
    let rate=(lo+hi)/2;
    for(let it=0;it<30;it++){let npv=cfs[0],dnpv=0;for(let j=1;j<cfs.length;j++){const dv=Math.pow(1+rate,j);npv+=cfs[j]/dv;dnpv+=-j*cfs[j]/Math.pow(1+rate,j+1)}if(Math.abs(dnpv)<1e-15)break;const nr=rate-npv/dnpv;if(Math.abs(nr-rate)<1e-10){rate=nr;break}rate=nr}
    const irr=rate*100;d.push({year:rows[i].year,irr:isFinite(irr)?irr:null});
  }
  return d;
}

// ====== 导出 ======
function exportExcel(){
  if(results.length===0)return alert('请先计算');
  const hasSB=results.some(r=>r.rows.some(row=>(row.survival_benefit||0)>0));
  const maxYr=Math.min(...results.map(r=>r.rows.length));
  const showSet=new Set(); for(let y=1;y<=maxYr;y++){if(y<=10||y%5===0||y===maxYr)showSet.add(y)}
  const rows=[['年度','年龄']];
  for(const r of results){
    const cols=[r.label+' 累计保费',r.label+' 保证CV',r.label+' 总CV(含红利)'];
    if(hasSB)cols.push(r.label+' 生存金/年金');
    cols.push(r.label+' 单利',r.label+' IRR');
    rows[0].push(...cols);
  }
  const irrExports=irrAll; // 复用render中已计算的IRR（只含展示年度）
  const simpleExports=results.map(r=>calcSimpleRate(r.rows,r.annual_premium,r.pmt_p));
  for(const yr of showSet){
    const r=[yr,results[0].entry_age+yr];
    for(let i=0;i<results.length;i++){
      const row=results[i].rows[yr-1]; const sr=simpleExports[i][yr-1];
      const ir=irrExports[i][yr-1]; const irrTxt=(ir&&ir.irr!=null&&ir.irr>=0)?ir.irr.toFixed(2)+'%':'-';
      r.push(row.cum_premium,row.guaranteed_cv,row.total_cv);
      if(hasSB)r.push(row.survival_benefit||0);
      r.push(sr&&sr.simple!=null?sr.simple.toFixed(2)+'%':'-',irrTxt);
    }
    rows.push(r);
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'利益对比');
  XLSX.writeFile(wb,'保险利益演示对比.xlsx');
}
