<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>分红型保险 · 利益演示对比</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f7fa;color:#333}
.header{background:linear-gradient(135deg,#1a2a6c,#2952a3);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;font-weight:600}
.container{max-width:1500px;margin:0 auto;padding:14px}
.panel{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px;overflow:hidden}
.panel-header{padding:10px 14px;border-bottom:1px solid #eee;font-weight:600;font-size:13px}
.panel-body{padding:14px}
.cat-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.cat-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #ddd;background:#fff;transition:all .2s;user-select:none}
.cat-tab.active{background:#2952a3;color:#fff;border-color:#2952a3}
.cat-tab:hover{border-color:#2952a3}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.prod-card{border:1px solid #e0e0e0;border-radius:8px;padding:12px;background:#fafafa;transition:border .2s}
.prod-card.selected{border-color:#2952a3;background:#f0f4ff}
.prod-card.hidden{display:none}
.prod-card label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:4px}
.prod-card input[type=checkbox]{width:16px;height:16px;accent-color:#2952a3}
.prod-card .cat-badge{font-size:10px;padding:2px 6px;border-radius:10px;color:#fff;font-weight:500;margin-left:4px}
.cat-badge.zeng额{background:#8e44ad}.cat-badge.快返{background:#e67e22}.cat-badge.养老{background:#27ae60}
.prod-meta{font-size:11px;color:#666;line-height:1.5;margin:4px 0 2px;padding-left:24px}
/* PATCH: slider-row 改 number input + 复位按钮 */
.prod-card .slider-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#666;margin-top:6px}
.prod-card .slider-row input[type=number]{width:64px;padding:3px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px;text-align:center;font-weight:600;color:#2952a3;outline:none}
.prod-card .slider-row input[type=number]:focus{border-color:#2952a3}
.prod-card .slider-row .rate-suffix{font-weight:600;color:#666;min-width:auto;text-align:left}
.prod-card .slider-row .rate-hint{font-size:10px;color:#999;min-width:auto;font-weight:400;text-align:right}
.prod-card .slider-row .btn-reset{padding:3px 8px;font-size:12px;background:#f0f0f0;color:#666;border:1px solid #ddd;border-radius:4px;cursor:pointer;line-height:1;min-width:auto;font-weight:500;transition:all .15s}
.prod-card .slider-row .btn-reset:hover{background:#e0e0e0;color:#2952a3;border-color:#2952a3}
/* END PATCH */
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:3px;min-width:100px}
.form-group label{font-size:11px;color:#666;font-weight:500}
.form-group input,.form-group select{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#2952a3}
.btn{padding:9px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;transition:all .2s}
.btn-primary{background:#2952a3;color:#fff}.btn-primary:hover{background:#1a3a7a}
.btn-outline{background:#fff;border:1px solid #2952a3;color:#2952a3}
.btn-green{background:#27ae60;color:#fff}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.card{background:#f8f9fb;padding:8px 10px;border-radius:6px;border:1px solid #eee}
.card .label{font-size:10px;color:#888}.card .value{font-size:15px;font-weight:700;color:#1a2a6c;margin:2px 0}
.card .sub{font-size:10px;color:#666}
.metric-table{max-height:360px;overflow:auto}
.metric-table table{font-size:12px}
.metric-table th,.metric-table td{padding:7px 6px}
.scope-bar{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:#555;line-height:1.5}
.scope-bar span{background:#f5f7fa;border:1px solid #e7ebf0;border-radius:6px;padding:4px 8px}
.skip-list{font-size:12px;line-height:1.7;color:#8a5a00}
.skip-list b{color:#7a4b00}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart-box{position:relative;height:300px}
.chart-box.full{grid-column:1/-1;height:340px}
.scroll-table{max-height:500px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:#f8f9fb;padding:6px 4px;text-align:right;font-weight:600;color:#555;border-bottom:2px solid #ddd;position:sticky;top:0;z-index:1;white-space:nowrap}
thead th:first-child,tbody td:first-child{text-align:center}
tbody td{padding:5px 4px;text-align:right;border-bottom:1px solid #f0f0f0}
.compare-table th:nth-child(1),.compare-table td:nth-child(1){position:sticky;left:0;background:#fff;z-index:2}
.compare-table th:nth-child(2),.compare-table td:nth-child(2){position:sticky;left:44px;background:#fff;z-index:2}
.compare-table thead th:nth-child(1),.compare-table thead th:nth-child(2){background:#f8f9fb;z-index:3}
.num{font-variant-numeric:tabular-nums;font-family:"SF Mono","Consolas",monospace}
.loading{text-align:center;padding:30px;color:#999}
.error{color:#e74c3c;padding:10px;background:#fdeaea;border-radius:6px;margin:8px 0}
@media(max-width:768px){.chart-row{grid-template-columns:1fr}.prod-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div><h1>分红型保险 · 利益演示对比</h1><span style="font-size:10px;opacity:.7">增额终身寿 / 快返年金 / 养老年金 · 分红实现率可调</span></div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-green" onclick="exportExcel()">📥 Excel</button>
    <button class="btn btn-outline" style="color:#e74c3c;border-color:#e74c3c" onclick="exportPDF()">📄 PDF</button>
  </div>
</div>

<div class="container">
  <div class="panel">
    <div class="panel-header">📋 选择对比产品 <span style="font-weight:400;font-size:11px;color:#999">（可多选，输入 0-200% 调整分红实现率）</span></div>
    <div class="panel-body">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="prod-grid" id="prodGrid">加载中...</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">⚙ 公共参数</div>
    <div class="panel-body">
      <div class="form-row">
        <div class="form-group"><label>投保年龄</label><input type="number" id="age" value="41" min="0" max="70"></div>
        <div class="form-group"><label>性别</label><select id="sex"><option value="1">男</option><option value="2" selected>女</option></select></div>
        <div class="form-group"><label>交费年期</label><select id="pmtP"><option value="1">趸交</option><option value="3">3年</option><option value="5" selected>5年</option><option value="6">6年</option><option value="10">10年</option></select></div>
        <div class="form-group"><label>年交保费 (¥)</label><input type="number" id="premium" value="100000" min="5000" step="1000"></div>
        <div class="form-group" id="annageGroup" style="display:none"><label>领取年龄</label><select id="annage"><option value="55">55岁</option><option value="60" selected>60岁</option><option value="65">65岁</option><option value="70">70岁</option></select></div>
        <div class="form-group" id="planGroup" style="display:none"><label>方案选择</label><select id="planSelect"><option value="1" selected>计划一</option><option value="2">计划二</option><option value="3">计划三</option><option value="4">计划四</option></select></div>
        <div class="form-group" style="align-self:flex-end"><button class="btn btn-primary" onclick="calcAll()">计算对比</button></div>
      </div>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
const DATA_CACHE_VERSION='20260709-v1';  // BUMP: 8 款新数据 + 新 calc
let catalog=[], dataCache={}, charts=[], results=[], activeCat='all', irrAll=[], skipped=[];
let _db=null;
function openDB(){if(_db)return Promise.resolve(_db);return new Promise(r=>{const req=indexedDB.open('ins-cache-'+DATA_CACHE_VERSION,1);req.onupgradeneeded=e=>e.target.result.createObjectStore('data');req.onsuccess=e=>{_db=e.target.result;r(_db)};req.onerror=()=>r(null)})}
async function idbGet(k){const db=await openDB();if(!db)return null;return new Promise(r=>{const tx=db.transaction('data','readonly');const req=tx.objectStore('data').get(k);req.onsuccess=()=>r(req.result||null);req.onerror=()=>r(null)})}
async function idbPut(k,v){const db=await openDB();if(!db)return;const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k)}

function fmt(n,d=0){if(n==null)return'-';return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function pct(v){return v==null?'-':v.toFixed(2)+'%'}
function prodDef(p){return p.meta.products&&p.meta.products[0]?p.meta.products[0]:{}}
function rangeText(a){return Array.isArray(a)?(a.length===2&&a[1]-a[0]>1?a[0]+'-'+a[1]:a.join('/')):'-'}
function productScopeText(p){
  const d=prodDef(p), parts=['年龄 '+rangeText(d.ages),'交费 '+rangeText(d.pay_terms)+'年'];
  if(d.annages)parts.push('领取 '+rangeText(d.annages)+'岁');
  if(d.plans)parts.push('方案 '+rangeText(d.plans));
  return parts.join(' · ');
}
function supportReason(p,age,pmtP,annage,plan){
  const d=prodDef(p), rs=[];
  if(d.ages&&(age<d.ages[0]||age>d.ages[1]))rs.push('年龄不在'+rangeText(d.ages)+'岁');
  if(d.pay_terms&&!d.pay_terms.includes(pmtP))rs.push('不支持'+pmtP+'年交');
  if(d.annages&&!d.annages.includes(annage))rs.push('不支持'+annage+'岁领取');
  if(d.plans&&!d.plans.includes(plan))rs.push('不支持计划'+plan);
  return rs.join('，');
}
function calcBasisText(r){
  if(r.category==='分红快返年金')return '现金流=保费+保证年金+现金红利，期末=总CV';
  if(r.category==='分红养老年金')return '现金流=保费+保证年金，红利不当年领取，期末=总CV';
  return '现金流=保费，期末=总CV';
}

const CAT_MAP={'增额终身寿':'zeng额','分红快返年金':'快返','分红养老年金':'养老'};

fetch('data/catalog.json?'+Date.now()).then(r=>r.json()).then(data=>{
  catalog=data;
  renderCatTabs();
  renderProdGrid();
});

function renderCatTabs(){
  const cats=['all','增额终身寿','分红快返年金','分红养老年金'];
  let h='';
  cats.forEach(c=>{
    const label=c==='all'?'全部':c;
    h+=`<div class="cat-tab${c===activeCat?' active':''}" onclick="filterCat('${c}')">${label}</div>`;
  });
  document.getElementById('catTabs').innerHTML=h;
}

function filterCat(cat){
  activeCat=cat;
  renderCatTabs();
  catalog.forEach((p,i)=>{
    const card=document.getElementById('card'+i);
    const pcat=p.meta.category||'增额终身寿';
    card.classList.toggle('hidden',cat!=='all'&&pcat!==cat);
  });
  const hasPension=catalog.some(p=>{
    const pcat=p.meta.category||'';
    const cb=document.getElementById('card'+catalog.indexOf(p))?.querySelector('input[type=checkbox]');
    return (cat==='all'||pcat===cat)&&pcat.includes('养老')&&cb?.checked;
  });
  document.getElementById('annageGroup').style.display=hasPension?'flex':'none';
  document.getElementById('planGroup').style.display='none';  // 无青鸾
}

function renderProdGrid(){
  let h='';
  catalog.forEach((p,i)=>{
    const cat=p.meta.category||'增额终身寿';
    const badge=CAT_MAP[cat]||'';
    const badgeCls=CAT_MAP[cat]||'zeng额';
    h+=`<div class="prod-card selected" id="card${i}">
      <label><input type="checkbox" checked onchange="toggleProd(${i},this.checked)">${p.label}<span class="cat-badge ${badgeCls}">${badge}</span></label>
      <div class="prod-meta">${productScopeText(p)}</div>
      <div class="slider-row">
        <span>分红实现率</span>
        <input type="number" id="rate${i}" min="0" max="200" step="1" value="100" oninput="clampRate(${i})">
        <span class="rate-suffix">%</span>
        <button type="button" class="btn-reset" onclick="resetRate(${i})" title="恢复 100%">↺ 复位</button>
        <span class="rate-hint">0-200</span>
      </div>
    </div>`;
  });
  document.getElementById('prodGrid').innerHTML=h;
}

function toggleProd(i,on){
  document.getElementById('card'+i).classList.toggle('selected',on);
}

// PATCH: 新增分红实现率 clamp/reset 函数
function clampRate(i){
  const el=document.getElementById('rate'+i);
  let v=parseInt(el.value,10);
  if(isNaN(v))v=100;
  if(v<0)v=0;
  if(v>200)v=200;
  if(String(v)!==el.value)el.value=v;
}
function resetRate(i){
  document.getElementById('rate'+i).value=100;
}
// END PATCH

async function loadData(p){
  const cacheKey=DATA_CACHE_VERSION+':'+p.name;
  if(dataCache[cacheKey])return dataCache[cacheKey];
  try{const c=await idbGet(cacheKey);if(c){dataCache[cacheKey]=c;return c;}}catch(e){}
  const basePath='data/'+p.name;
  let data;
  try{
    const resp=await fetch(basePath+'.json.gz?'+Date.now());
    if(resp.ok){
      const buf=await resp.arrayBuffer();
      const decompressed=pako.inflate(new Uint8Array(buf),{to:'string'});
      data=JSON.parse(decompressed);
    }
  }catch(e){}
  if(!data){
    try{data=await fetch(basePath+'.json?'+Date.now()).then(r=>r.json());}catch(e){}
  }
  if(!data)return null;
  dataCache[cacheKey]=data;
  try{idbPut(cacheKey,data);}catch(e){}
  return data;
}

// ====== 8 款新产品的 calc 函数（基于完整底表数据） ======
// 数据格式:
//   d.data["{pmtP}_{sex}_{age}"] = {
//     cv: [],   // 保证 CV (元/1000元保费)
//     rb: [],   // 当年新增增额红利保额 (保额分红型)
//     rbcv: [], // 累积增额红利保额对应 CV (保额分红型)
//     tb: [],   // 终了红利 (保额分红型)
//     cv_bonus/cash_bonus/bonus_ba: [],  // 星福家
//     dtypes: {1: [], 3: [], 5: []},    // 国泰 form汇总
//     bonus_cv: [],                       // 太保分红交清增额 CV
//     prem/sa/f1-f16: [],                 // 中邮 FactorTable
//   }
// 实现率 rate: 0-2 (用户输入 0-200 ÷ 100)
// dividend_ratio: 保司可分配盈余比例 (meta 字段, 0.7 / 0.01575 等)
function calcBA(age, sex, pmtP, prem, d, rate, p) {
  const key = `${pmtP}_${sex}_${age}`;
  const item = d.data && d.data[key];
  if (!item || !item.cv) return null;
  const cvList = item.cv;
  // V4: 优先用预计算的 bonus_cv / tb，兼容旧 rb/rbcv/tb
  const bonusCVList = item.bonus_cv || [];
  const tbList = item.tb || [];
  const share = prem / 1000;
  const maxYr = Math.min(105 - age, cvList.length);
  let rows = [], cumPre = 0;
  for (let t = 1; t <= maxYr; t++) {
    const pr = t <= pmtP ? prem : 0; cumPre += pr;
    const idx = t - 1;
    const gCV = (cvList[idx] || 0) * share;
    // V4: bonus_cv 已是 per 1000 premium 的中档演示值
    const demoBonusCV = (bonusCVList[idx] || 0) * share;
    const demoTerminalB = (tbList[idx] || 0) * share;
    const bonusCV_adj = demoBonusCV * rate;
    const terminalB_adj = demoTerminalB * rate;
    const totalCV = gCV + bonusCV_adj;
    const gDB = Math.max(gCV * 1.2, cumPre * 1.6);
    rows.push({
      year: t, age: age + t, premium: pr, cum_premium: Math.round(cumPre),
      guaranteed_cv: Math.round(gCV),
      guaranteed_db: Math.round(gDB),
      raw_bonus_cv: Math.round(demoBonusCV),
      raw_bonus_db: Math.round(demoBonusCV + demoTerminalB),
      terminal_bonus: Math.round(demoTerminalB),
      total_cv: Math.round(totalCV),
      total_db: Math.round(gDB + bonusCV_adj + terminalB_adj),
    });
  }
  return { rows, annual_premium: prem, pmt_p: pmtP, entry_age: age, sa_basic: 0 };
}

function calcJQ(age, sex, pmtP, prem, d, rate, p) {
  const key = `${pmtP}_${sex}_${age}`;
  const item = d.data && d.data[key];
  if (!item) return null;
  const share = prem / 1000;
  const cvList = item.cv || item.cv_list || [];
  const bonusCVList = item.bonus_cv || item.bonus_cv_list || [];
  const maxYr = Math.min(105 - age, cvList.length);
  let rows = [], cumPre = 0;
  for (let t = 1; t <= maxYr; t++) {
    const pr = t <= pmtP ? prem : 0; cumPre += pr;
    const idx = t - 1;
    const gCV = (cvList[idx] || 0) * share;
    const demoBonusCV = (bonusCVList[idx] || 0) * share;
    const bonusCV_adj = demoBonusCV * rate;
    rows.push({
      year: t, age: age + t, premium: pr, cum_premium: Math.round(cumPre),
      guaranteed_cv: Math.round(gCV),
      guaranteed_db: Math.max(Math.round(gCV * 1.2), Math.round(cumPre * 1.6)),
      raw_bonus_cv: Math.round(demoBonusCV),
      raw_bonus_db: Math.round(demoBonusCV),
      total_cv: Math.round(gCV + bonusCV_adj),
      total_db: Math.round(gCV + bonusCV_adj),
    });
  }
  return { rows, annual_premium: prem, pmt_p: pmtP, entry_age: age, sa_basic: 0 };
}

async function calcAll(){
  const a=+age.value, s=+sex.value, pt=+pmtP.value, pr=+premium.value, ann=+annage.value, plan=+planSelect.value;
  results=[]; skipped=[]; charts.forEach(c=>c.destroy()); charts=[];
  document.getElementById('result').innerHTML='<div class="loading">计算中...</div>';

  const todo=[];
  for(let i=0;i<catalog.length;i++){
    const card=document.getElementById('card'+i);
    if(!card||card.classList.contains('hidden'))continue;
    const cb=card.querySelector('input[type=checkbox]');
    if(!cb||!cb.checked) continue;
    const reason=supportReason(catalog[i],a,pt,ann,plan);
    if(reason){skipped.push({label:catalog[i].label,reason});continue}
    // PATCH: 加 (rate||0) 保险
    todo.push({idx:i,p:catalog[i],rate:(parseInt(document.getElementById('rate'+i).value)||0)/100});
  }
  await Promise.all(todo.map(t=>loadData(t.p)));

  for(const t of todo){
    const cacheKey=DATA_CACHE_VERSION+':'+t.p.name;
    const d=dataCache[cacheKey];
    if(!d){skipped.push({label:t.p.label,reason:'数据文件未加载成功'});continue}
    let r;
    const ct=t.p.meta.calc_type;
    // === 8 款新产品 calc 分发 ===
    // calc_type: zhongying_ba / zhongying_cv_only / zhongyi / zhongyou / taibao / xingfu / guotai
    const ct = t.p.meta.calc_type;
    const isBA = (ct === 'zhongying_ba' || ct === 'zhongying_cv_only' || ct === 'zhongyi' || ct === 'xingfu' || ct === 'guotai');
    const isJQ = (ct === 'zhongyou' || ct === 'taibao');
    if (isBA) {
      r = calcBA(a, s, pt, pr, d, t.rate, t.p);
    } else if (isJQ) {
      r = calcJQ(a, s, pt, pr, d, t.rate, t.p);
    } else {
      skipped.push({label:t.p.label,reason:'不支持的 calc_type: '+ct});
      continue;
    }
    if(!r||!r.rows){skipped.push({label:t.p.label,reason:'当前参数没有匹配费率'});continue}
    r.label=t.p.label; r.dividend_rate=t.rate; r.category=t.p.meta.category||'增额终身寿';
    results.push(r);
  }
  if(results.length===0){
    const msg=skipped.length?'当前参数下没有可计算产品：'+skipped.map(s=>`${s.label}（${s.reason}）`).join('；'):'无产品被选中或计算失败';
    document.getElementById('result').innerHTML=`<div class="error">${msg}</div>`;return
  }
  render();
}

function calcSimpleRate(rows,premium,pmtP){
  const d=[];
  let cumSB=0;
  for(const row of rows){
    const yrs=row.year;
    const sb=(row.survival_benefit||0);
    cumSB+=sb;
    const val=(row.total_cv||(row.guaranteed_cv+(row.raw_bonus_cv||0)))+cumSB;
    if(val<=0||yrs<1){d.push({year:row.year,simple:null});continue}
    let weightedInvest=0, totalInvest=0;
    for(let y=1;y<=yrs;y++){
      if(y<=pmtP){weightedInvest+=premium*(yrs-y+1);totalInvest+=premium}
    }
    const gain=val-totalInvest;
    const simple=weightedInvest>0?gain/weightedInvest*100:null;
    d.push({year:row.year,simple:simple});
  }
  return d;
}

function render(){
  let html='';
  const maxYr=Math.min(...results.map(r=>r.rows.length));
  const showSet=new Set(); for(let y=1;y<=maxYr;y++){if(y<=10||y%5===0||y===maxYr)showSet.add(y)}

  html+='<div class="panel"><div class="panel-header">本次计算口径</div><div class="panel-body">';
  html+=`<div class="scope-bar">
    <span>投保年龄 ${results[0].entry_age}岁</span>
    <span>交费期 ${results[0].pmt_p}年</span>
    <span>年交保费 ¥${fmt(results[0].annual_premium)}</span>
    <span>展示年度至第${maxYr}年</span>
    <span>总CV=保证CV+红利现价×分红实现率</span>
    <span>单利=总回报/加权投入</span>
    <span>IRR=逐年现金流折现</span>
  </div>`;
  if(skipped.length){
    html+='<div class="skip-list" style="margin-top:10px"><b>未参与计算：</b>'+skipped.map(s=>`${s.label}（${s.reason}）`).join('；')+'</div>';
  }
  html+='</div></div>';

  html+='<div class="chart-row"><div class="chart-box full"><canvas id="cCmpCV"></canvas></div></div>';

  // total_cv / total_db 已由 calc 直接输出 (含分红实现率)

  const hasSB=results.some(r=>r.rows.some(row=>(row.survival_benefit||0)>0));

  html+='<div class="panel"><div class="panel-header">关键指标对比</div><div class="metric-table"><table><thead><tr><th style="text-align:left">产品</th><th>类别</th><th>分红</th><th>回本年</th><th>翻倍年</th><th>10年IRR</th><th>20年IRR</th><th>20年总CV</th><th style="text-align:left">IRR口径</th></tr></thead><tbody>';
  for(const r of results){
    let be='—',db2='—',cumSB2=0;
    for(const row of r.rows){
      cumSB2+=(row.survival_benefit||0);
      const totalCvDb=(row.total_cv||row.guaranteed_cv)+cumSB2;
      if(be==='—'&&totalCvDb>=row.cum_premium)be=row.year;
      if(db2==='—'&&totalCvDb>=row.cum_premium*2)db2=row.year;
    }
    const row10=r.rows[9]; const row20=r.rows[19];
    function quickIRR(yrs){
      return solveIRR(buildIRRCashflows(r.rows.slice(0,yrs),r.annual_premium,r.pmt_p));
    }
    const irr10v=quickIRR(10); const irr20v=quickIRR(20);
    html+=`<tr>
      <td style="text-align:left;font-weight:600">${r.label}</td>
      <td>${r.category}</td>
      <td>${Math.round(r.dividend_rate*100)}%</td>
      <td>${be==='—'?'-':be}</td>
      <td>${db2==='—'?'-':db2}</td>
      <td class="num">${pct(irr10v)}</td>
      <td class="num">${pct(irr20v)}</td>
      <td class="num">${fmt(row20?row20.total_cv:0)}</td>
      <td style="text-align:left;color:#666">${calcBasisText(r)}</td>
    </tr>`;
  }
  html+='</tbody></table></div></div>';

  const colsPerProduct=hasSB?7:5;
  html+='<div class="panel"><div class="panel-header">利益演示对比</div><div class="scroll-table"><table class="compare-table"><thead><tr><th>年度</th><th>年龄</th>';
  for(const r of results){
    html+=`<th colspan="${colsPerProduct}">${r.label} (分红${Math.round(r.dividend_rate*100)}%)</th>`;
  }
  html+='</tr><tr style="font-size:10px"><th></th><th></th>';
  for(let i=0;i<results.length;i++){
    html+='<th>累计<br>保费</th><th>保证<br>CV</th><th>总CV<br>(含红利)</th>';
    if(hasSB)html+='<th>生存金/<br>年金</th>';
    html+='<th>单利</th><th>IRR</th>';
  }
  html+='</tr></thead><tbody>';

  const simpleRates=results.map(r=>calcSimpleRate(r.rows,r.annual_premium,r.pmt_p));
  irrAll=results.map(r=>{
    const full=new Array(r.rows.length).fill(null);
    for(const yr of showSet){
      if(yr<2)continue;
      full[yr-1]={year:yr,irr:solveIRR(buildIRRCashflows(r.rows.slice(0,yr),r.annual_premium,r.pmt_p))};
    }
    return full;
  });

  for(const yr of showSet){
    html+=`<tr${yr%10===0?' style="background:#fff9e6"':''}><td>${yr}</td><td>${results[0].entry_age+yr}</td>`;
    for(let i=0;i<results.length;i++){
      const row=results[i].rows[yr-1]; const sr=simpleRates[i][yr-1]; const ir=irrAll[i][yr-1];
      const irrTxt=(ir&&ir.irr!=null&&ir.irr>=0)?ir.irr.toFixed(2)+'%':'-';
      const totalCv=row.total_cv||(row.guaranteed_cv+(row.raw_bonus_cv||0));
      html+=`<td class="num">${fmt(row.cum_premium)}</td>
        <td class="num" style="color:#2952a3">${fmt(row.guaranteed_cv)}</td>
        <td class="num" style="font-weight:700;color:#1a2a6c">${fmt(totalCv)}</td>`;
      if(hasSB)html+=`<td class="num" style="color:#27ae60">${fmt(row.survival_benefit||0)}</td>`;
      html+=`<td class="num" style="color:#e67e22">${sr&&sr.simple!=null?sr.simple.toFixed(2)+'%':'-'}</td>
        <td class="num" style="color:${ir&&ir.irr&&ir.irr>3?'#27ae60':'#666'}">${irrTxt}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table></div></div>';

  document.getElementById('result').innerHTML=html;
  setTimeout(()=>drawChart(),100);
}

function drawChart(){
  const maxYr=Math.min(...results.map(r=>r.rows.length));
  const filter=[]; for(let y=1;y<=maxYr;y++){if(y<=30||y%5===0)filter.push(y); if(y>60)break}
  const colors=['#2952a3','#e74c3c','#27ae60','#e67e22','#8e44ad','#16a085','#c0392b','#2c3e50','#d35400','#16a085','#8e44ad'];
  const datasets=results.map((r,i)=>{
    const lbl=filter.map(y=>{const row=r.rows[y-1];return row?(row.total_cv||(row.guaranteed_cv+(row.raw_bonus_cv||0))):null});
    return {
      label:`${r.label} (分红${Math.round(r.dividend_rate*100)}%)`,
      data:lbl,borderColor:colors[i%colors.length],
      backgroundColor:colors[i%colors.length]+'20',fill:false,tension:.3
    };
  });
  charts.push(new Chart(document.getElementById('cCmpCV'),{type:'line',data:{labels:filter,datasets},
    options:{responsive:true,maintainAspectRatio:false,
    plugins:{title:{display:true,text:'总现金价值对比（含红利×分红实现率）',font:{size:13}}},
    scales:{y:{ticks:{callback:v=>fmt(v/10000)+'万'}}}}}));
}

function npvAt(rate,cfs){let s=cfs[0];for(let j=1;j<cfs.length;j++)s+=cfs[j]/Math.pow(1+rate,j);return s}
function buildIRRCashflows(rows,premium,pmtP){
  const yrs=rows.length, cfs=new Array(yrs+1).fill(0);
  if(pmtP>=1)cfs[0]-=premium;
  for(let yr=1;yr<yrs;yr++){
    if(yr+1<=pmtP)cfs[yr]-=premium;
    cfs[yr]+=(rows[yr-1].survival_benefit||0);
  }
  cfs[yrs]+=(rows[yrs-1].survival_benefit||0);
  cfs[yrs]+=(rows[yrs-1].total_cv||(rows[yrs-1].guaranteed_cv+(rows[yrs-1].raw_bonus_cv||0)));
  return cfs;
}
function solveIRR(cfs){
  let lo=-0.999,hi=2.0,flo=npvAt(lo,cfs),fhi=npvAt(hi,cfs);
  if(flo*fhi>0) return null;
  for(let it=0;it<60;it++){const mid=(lo+hi)/2,fm=npvAt(mid,cfs);if(Math.abs(fm)<1e-6){lo=hi=mid;break}if(flo*fm<0)hi=mid;else lo=mid;if(hi-lo<1e-10)break}
  let rate=(lo+hi)/2;
  for(let it=0;it<30;it++){let npv=0,dnpv=0;for(let j=0;j<cfs.length;j++){const dv=Math.pow(1+rate,j);npv+=cfs[j]/dv;if(j>0)dnpv+=-j*cfs[j]/Math.pow(1+rate,j+1)}if(Math.abs(dnpv)<1e-15)break;const nr=rate-npv/dnpv;if(Math.abs(nr-rate)<1e-10){rate=nr;break}rate=nr}
  const irr=rate*100; return isFinite(irr)?irr:null;
}

function exportExcel(){
  if(results.length===0)return alert('请先计算');
  const hasSB=results.some(r=>r.rows.some(row=>(row.survival_benefit||0)>0));
  const maxYr=Math.min(...results.map(r=>r.rows.length));
  const showSet=new Set(); for(let y=1;y<=maxYr;y++){if(y<=10||y%5===0||y===maxYr)showSet.add(y)}
  const rows=[['年度','年龄']];
  for(const r of results){
    const cols=[r.label+' 累计保费',r.label+' 保证CV',r.label+' 总CV(含红利)'];
    if(hasSB)cols.push(r.label+' 生存金/年金');
    cols.push(r.label+' 单利',r.label+' IRR');
    rows[0].push(...cols);
  }
  const simpleExports=results.map(r=>calcSimpleRate(r.rows,r.annual_premium,r.pmt_p));
  for(const yr of showSet){
    const r=[yr,results[0].entry_age+yr];
    for(let i=0;i<results.length;i++){
      const row=results[i].rows[yr-1]; const sr=simpleExports[i][yr-1];
      const ir=irrAll[i][yr-1]; const irrTxt=(ir&&ir.irr!=null&&ir.irr>=0)?ir.irr.toFixed(2)+'%':'-';
      const totalCv=row.total_cv||(row.guaranteed_cv+(row.raw_bonus_cv||0));
      r.push(row.cum_premium,row.guaranteed_cv,totalCv);
      if(hasSB)r.push(row.survival_benefit||0);
      r.push(sr&&sr.simple!=null?sr.simple.toFixed(2)+'%':'-',irrTxt);
    }
    rows.push(r);
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'利益对比');
  XLSX.writeFile(wb,'保险利益演示对比.xlsx');
}
